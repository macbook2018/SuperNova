[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supernova-api"
version = "0.4.0"
description = "SuperNova multi-tenant AI Agent SaaS control plane and API gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "email-validator>=2.2,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<7.0",
  "structlog>=24.4,<26.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "PyJWT>=2.10,<3.0",
  "cryptography>=43.0,<47.0",
  "httpx>=0.27,<1.0",
  "pgvector>=0.3.6,<1.0",
  "boto3>=1.35,<2.0",
  "python-multipart>=0.0.18,<1.0",
  "pypdf>=5.1,<7.0",
  "python-docx>=1.1,<2.0",
  "python-pptx>=1.0,<2.0",
  "openpyxl>=3.1,<4.0",
  "beautifulsoup4>=4.12,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.7,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
