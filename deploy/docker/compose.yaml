name: supernova

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supernova}
      POSTGRES_USER: ${POSTGRES_USER:-supernova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supernova} -d ${POSTGRES_DB:-supernova}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-change-me-local-only}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 使用社区维护的 Silo，提供兼容 MinIO 的 S3 对象存储接口。
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-supernova}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 3

  console:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../../apps/console:/app
      - console_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      SUPERNOVA_ENVIRONMENT: ${SUPERNOVA_ENVIRONMENT:-development}
      SUPERNOVA_BILLING_SUBSCRIPTION_ENFORCEMENT_ENABLED: ${SUPERNOVA_BILLING_SUBSCRIPTION_ENFORCEMENT_ENABLED:-false}
      SUPERNOVA_LOG_LEVEL: ${SUPERNOVA_LOG_LEVEL:-INFO}
      SUPERNOVA_DATABASE_URL: postgresql://${POSTGRES_USER:-supernova}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-supernova}
      SUPERNOVA_REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-local-only}@redis:6379/0
      SUPERNOVA_JWT_SECRET: ${SUPERNOVA_JWT_SECRET:-local-development-only-secret-change-before-deploy-2026}
      SUPERNOVA_PLATFORM_CREDENTIALS_JSON: ${SUPERNOVA_PLATFORM_CREDENTIALS_JSON:-}
      SUPERNOVA_AUDIO_TRANSCRIPTION_BASE_URL: "${SUPERNOVA_AUDIO_TRANSCRIPTION_BASE_URL:-}"
      SUPERNOVA_AUDIO_TRANSCRIPTION_MODEL: "${SUPERNOVA_AUDIO_TRANSCRIPTION_MODEL:-}"
      SUPERNOVA_AUDIO_TRANSCRIPTION_CREDENTIAL_REF: "${SUPERNOVA_AUDIO_TRANSCRIPTION_CREDENTIAL_REF:-}"
      SUPERNOVA_AUDIO_TRANSCRIPTION_MAX_FILE_BYTES: "${SUPERNOVA_AUDIO_TRANSCRIPTION_MAX_FILE_BYTES:-26214400}"
      SUPERNOVA_AUDIO_TRANSCRIPTION_TIMEOUT_SECONDS: "${SUPERNOVA_AUDIO_TRANSCRIPTION_TIMEOUT_SECONDS:-120}"
      SUPERNOVA_AUDIO_TRANSCRIPTION_SAMPLE_RATE: "${SUPERNOVA_AUDIO_TRANSCRIPTION_SAMPLE_RATE:-24000}"
      SUPERNOVA_AUDIO_TRANSCRIPTION_MAX_DECODED_BYTES: "${SUPERNOVA_AUDIO_TRANSCRIPTION_MAX_DECODED_BYTES:-67108864}"
      SUPERNOVA_PLATFORM_ADMIN_EMAILS: ${SUPERNOVA_PLATFORM_ADMIN_EMAILS:-}
      SUPERNOVA_ENCRYPTION_KEY: ${SUPERNOVA_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      SUPERNOVA_ACCESS_TOKEN_TTL_MINUTES: ${SUPERNOVA_ACCESS_TOKEN_TTL_MINUTES:-15}
      SUPERNOVA_REFRESH_TOKEN_TTL_DAYS: ${SUPERNOVA_REFRESH_TOKEN_TTL_DAYS:-30}
      SUPERNOVA_CORS_ORIGINS: ${SUPERNOVA_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SUPERNOVA_S3_ENDPOINT_URL: ${SUPERNOVA_S3_ENDPOINT_URL:-http://minio:9000}
      SUPERNOVA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-supernova}
      SUPERNOVA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
      SUPERNOVA_S3_BUCKET: ${SUPERNOVA_S3_BUCKET:-supernova-knowledge}
      SUPERNOVA_S3_REGION: ${SUPERNOVA_S3_REGION:-us-east-1}
      SUPERNOVA_KNOWLEDGE_MAX_UPLOAD_BYTES: ${SUPERNOVA_KNOWLEDGE_MAX_UPLOAD_BYTES:-26214400}
      SUPERNOVA_KNOWLEDGE_MAX_URL_BYTES: ${SUPERNOVA_KNOWLEDGE_MAX_URL_BYTES:-20971520}
      SUPERNOVA_KNOWLEDGE_WORKER_POLL_SECONDS: ${SUPERNOVA_KNOWLEDGE_WORKER_POLL_SECONDS:-2}
      SUPERNOVA_KNOWLEDGE_WORKER_LEASE_SECONDS: ${SUPERNOVA_KNOWLEDGE_WORKER_LEASE_SECONDS:-900}
      SUPERNOVA_EMBEDDING_TIMEOUT_SECONDS: ${SUPERNOVA_EMBEDDING_TIMEOUT_SECONDS:-60}
      SUPERNOVA_CHAT_IMPORT_MAX_FILE_BYTES: ${SUPERNOVA_CHAT_IMPORT_MAX_FILE_BYTES:-52428800}
      SUPERNOVA_CHAT_IMPORT_MAX_BATCH_BYTES: ${SUPERNOVA_CHAT_IMPORT_MAX_BATCH_BYTES:-104857600}
      SUPERNOVA_CHAT_IMPORT_MAX_FILES: ${SUPERNOVA_CHAT_IMPORT_MAX_FILES:-20}
      SUPERNOVA_CHAT_IMPORT_WORKER_POLL_SECONDS: ${SUPERNOVA_CHAT_IMPORT_WORKER_POLL_SECONDS:-2}
      SUPERNOVA_CHAT_IMPORT_WORKER_LEASE_SECONDS: ${SUPERNOVA_CHAT_IMPORT_WORKER_LEASE_SECONDS:-180}
      SUPERNOVA_CHAT_IMPORT_BATCH_SIZE: ${SUPERNOVA_CHAT_IMPORT_BATCH_SIZE:-500}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.knowledge.worker"]
    environment:
      SUPERNOVA_ENVIRONMENT: ${SUPERNOVA_ENVIRONMENT:-development}
      SUPERNOVA_LOG_LEVEL: ${SUPERNOVA_LOG_LEVEL:-INFO}
      SUPERNOVA_JWT_SECRET: ${SUPERNOVA_JWT_SECRET:-local-development-only-secret-change-before-deploy-2026}
      SUPERNOVA_PLATFORM_CREDENTIALS_JSON: ${SUPERNOVA_PLATFORM_CREDENTIALS_JSON:-}
      SUPERNOVA_DATABASE_URL: postgresql://${POSTGRES_USER:-supernova}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-supernova}
      SUPERNOVA_ENCRYPTION_KEY: ${SUPERNOVA_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      SUPERNOVA_S3_ENDPOINT_URL: ${SUPERNOVA_S3_ENDPOINT_URL:-http://minio:9000}
      SUPERNOVA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-supernova}
      SUPERNOVA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
      SUPERNOVA_S3_BUCKET: ${SUPERNOVA_S3_BUCKET:-supernova-knowledge}
      SUPERNOVA_S3_REGION: ${SUPERNOVA_S3_REGION:-us-east-1}
      SUPERNOVA_KNOWLEDGE_MAX_UPLOAD_BYTES: ${SUPERNOVA_KNOWLEDGE_MAX_UPLOAD_BYTES:-26214400}
      SUPERNOVA_KNOWLEDGE_MAX_URL_BYTES: ${SUPERNOVA_KNOWLEDGE_MAX_URL_BYTES:-20971520}
      SUPERNOVA_KNOWLEDGE_WORKER_POLL_SECONDS: ${SUPERNOVA_KNOWLEDGE_WORKER_POLL_SECONDS:-2}
      SUPERNOVA_KNOWLEDGE_WORKER_LEASE_SECONDS: ${SUPERNOVA_KNOWLEDGE_WORKER_LEASE_SECONDS:-900}
      SUPERNOVA_EMBEDDING_TIMEOUT_SECONDS: ${SUPERNOVA_EMBEDDING_TIMEOUT_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.knowledge.worker", "--check"]
      interval: 30s
      timeout: 5s
      retries: 5

  chat-import-worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.chat_import.worker"]
    environment:
      SUPERNOVA_ENVIRONMENT: ${SUPERNOVA_ENVIRONMENT:-development}
      SUPERNOVA_LOG_LEVEL: ${SUPERNOVA_LOG_LEVEL:-INFO}
      SUPERNOVA_DATABASE_URL: postgresql://${POSTGRES_USER:-supernova}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-supernova}
      SUPERNOVA_JWT_SECRET: ${SUPERNOVA_JWT_SECRET:-local-development-only-secret-change-before-deploy-2026}
      SUPERNOVA_ENCRYPTION_KEY: ${SUPERNOVA_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      SUPERNOVA_S3_ENDPOINT_URL: ${SUPERNOVA_S3_ENDPOINT_URL:-http://minio:9000}
      SUPERNOVA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-supernova}
      SUPERNOVA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
      SUPERNOVA_S3_BUCKET: ${SUPERNOVA_S3_BUCKET:-supernova-knowledge}
      SUPERNOVA_S3_REGION: ${SUPERNOVA_S3_REGION:-us-east-1}
      SUPERNOVA_CHAT_IMPORT_MAX_FILE_BYTES: ${SUPERNOVA_CHAT_IMPORT_MAX_FILE_BYTES:-52428800}
      SUPERNOVA_CHAT_IMPORT_MAX_FILES: ${SUPERNOVA_CHAT_IMPORT_MAX_FILES:-20}
      SUPERNOVA_CHAT_IMPORT_WORKER_POLL_SECONDS: ${SUPERNOVA_CHAT_IMPORT_WORKER_POLL_SECONDS:-2}
      SUPERNOVA_CHAT_IMPORT_WORKER_LEASE_SECONDS: ${SUPERNOVA_CHAT_IMPORT_WORKER_LEASE_SECONDS:-180}
      SUPERNOVA_CHAT_IMPORT_BATCH_SIZE: ${SUPERNOVA_CHAT_IMPORT_BATCH_SIZE:-500}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.chat_import.worker", "--check"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
  console_node_modules:
