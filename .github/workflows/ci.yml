name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console:
    name: Console typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install console dependencies
        run: npm install --prefix apps/console --no-audit --no-fund
      - name: Typecheck and build console
        run: npm run build --prefix apps/console

  api:
    name: API lint, tests and migrations
    runs-on: ubuntu-latest
    env:
      SUPERNOVA_DATABASE_URL: postgresql+psycopg://supernova:supernova@localhost:5432/supernova
      SUPERNOVA_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: supernova
          POSTGRES_USER: supernova
          POSTGRES_PASSWORD: supernova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supernova -d supernova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"

      - name: Ruff
        run: ruff check --config apps/api/pyproject.toml apps/api/app apps/api/tests apps/api/migrations

      - name: Tests
        run: pytest -c apps/api/pyproject.toml apps/api/tests

      - name: Database migrations
        run: alembic -c apps/api/alembic.ini upgrade head

  compose-smoke:
    name: Docker Compose build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose -f deploy/docker/compose.yaml config --quiet

      - name: Validate staging Compose and deployment scripts
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          SUPERNOVA_JWT_SECRET: ci-supernova-jwt-secret-at-least-32-characters
          SUPERNOVA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          SUPERNOVA_PLATFORM_ADMIN_EMAILS: ci@example.com
          SUPERNOVA_CORS_ORIGINS: https://bot.ai-supernova.com
          SUPERNOVA_S3_ACCESS_KEY: ci-supernova
          SUPERNOVA_S3_SECRET_KEY: ci-supernova-secret-key-123456
        run: |
          bash -n deploy/scripts/bootstrap-staging.sh
          bash -n deploy/scripts/deploy-staging.sh
          bash -n deploy/scripts/rollback-staging.sh
          docker compose --project-name supernova-staging -f deploy/docker/compose.staging.yaml config --quiet

      - name: Start stack
        run: docker compose -f deploy/docker/compose.yaml up --build -d

      - name: Run database migrations
        run: docker compose -f deploy/docker/compose.yaml exec -T api alembic upgrade head

      - name: Verify API health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/health/ready >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8001/health/live
          curl -fsS http://127.0.0.1:8001/health/ready

      - name: Verify non-root API and S3 storage readiness
        run: |
          test "$(docker compose -f deploy/docker/compose.yaml exec -T api id -u)" != "0"
          docker compose -f deploy/docker/compose.yaml exec -T minio silo healthcheck ready

      - name: Verify Chinese console
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5173/ | grep -q "SuperNova"
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker/compose.yaml down -v

  staging-deploy:
    name: Publish and deploy staging images
    if: github.ref == 'refs/heads/feat/phase-6-knowledge-base-rag' && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: [console, api, compose-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_GHCR_READ_TOKEN: ${{ secrets.STAGING_GHCR_READ_TOKEN }}
      STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH || '/opt/supernova-staging' }}
      STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL || 'https://api.ai-supernova.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate staging secrets
        run: |
          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"
          test -n "$STAGING_SSH_PRIVATE_KEY"
          test -n "$STAGING_GHCR_READ_TOKEN"
          test -n "$STAGING_API_BASE_URL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/supernova-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/supernova-api:staging-latest
          cache-from: type=gha,scope=supernova-api
          cache-to: type=gha,mode=max,scope=supernova-api

      - name: Build and publish Console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/console/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.STAGING_API_BASE_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/supernova-console:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/supernova-console:staging-latest
          cache-from: type=gha,scope=supernova-console
          cache-to: type=gha,mode=max,scope=supernova-console

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$STAGING_SSH_PORT" -H "$STAGING_HOST" >> ~/.ssh/known_hosts

      - name: Upload staging deployment files
        run: |
          ssh -p "$STAGING_SSH_PORT" "$STAGING_USER@$STAGING_HOST" \
            "mkdir -p '$STAGING_DEPLOY_PATH'"
          scp -P "$STAGING_SSH_PORT" \
            deploy/docker/compose.staging.yaml \
            deploy/scripts/bootstrap-staging.sh \
            deploy/scripts/deploy-staging.sh \
            deploy/scripts/rollback-staging.sh \
            "$STAGING_USER@$STAGING_HOST:$STAGING_DEPLOY_PATH/"
          ssh -p "$STAGING_SSH_PORT" "$STAGING_USER@$STAGING_HOST" \
            "chmod 700 '$STAGING_DEPLOY_PATH/'*.sh"

      - name: Check server bootstrap state
        id: bootstrap
        run: |
          if ssh -p "$STAGING_SSH_PORT" "$STAGING_USER@$STAGING_HOST" \
            "test -s '$STAGING_DEPLOY_PATH/.env'"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy immutable image tag
        if: steps.bootstrap.outputs.ready == 'true'
        run: |
          DOCKER_CONFIG_DIR="/tmp/supernova-ghcr-${{ github.run_id }}"
          printf '%s' "$STAGING_GHCR_READ_TOKEN" | ssh -p "$STAGING_SSH_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            "set -eu
             cd '$STAGING_DEPLOY_PATH'
             export DOCKER_CONFIG='$DOCKER_CONFIG_DIR'
             mkdir -p \"\$DOCKER_CONFIG\"
             docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin
             if ./deploy-staging.sh '${{ github.sha }}'; then
               result=0
             else
               result=\$?
             fi
             docker logout ghcr.io >/dev/null 2>&1 || true
             rm -rf \"\$DOCKER_CONFIG\"
             exit \"\$result\""

      - name: Report first-time server bootstrap
        if: steps.bootstrap.outputs.ready != 'true'
        run: |
          echo "Deployment files and images were prepared, but the server .env is not initialized yet."
          echo "SSH to the server, create the MinIO bucket-only account, then run:"
          echo "cd '$STAGING_DEPLOY_PATH' && ./bootstrap-staging.sh"
          {
            echo "## Server bootstrap required"
            echo "Deployment files were uploaded. Initialize the server-only .env and MinIO bucket credentials, then run this workflow again."
          } >> "$GITHUB_STEP_SUMMARY"

