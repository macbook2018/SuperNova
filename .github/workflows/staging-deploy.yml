name: Staging Deploy

on:
  workflow_call:
    inputs:
      deploy_sha:
        description: Exact commit SHA to deploy from the unified development branch.
        required: true
        type: string

# The lock is held through deployment and the post-deploy acceptance gate.
concurrency:
  group: supernova-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, deploy and verify Staging
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH || '/opt/supernova-staging' }}
      STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL || 'https://api.wet001.com' }}
      STAGING_CONSOLE_BASE_URL: ${{ vars.STAGING_CONSOLE_BASE_URL || 'https://bot.wet001.com' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout exact deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_sha }}

      - name: Lock deployment commit SHA
        id: lock-sha
        env:
          EXPECTED_SHA: ${{ inputs.deploy_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "deploy_sha must be a full 40-character Git commit SHA."
            exit 2
          fi
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "Deployment commit locked to $actual_sha"

      - name: Validate staging secrets
        run: |
          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"
          test -n "$STAGING_SSH_PRIVATE_KEY"
          test -n "$STAGING_API_BASE_URL"
          test -n "$STAGING_CONSOLE_BASE_URL"
          test "$DOCKERHUB_USERNAME" = "macbook201808"
          test -n "$DOCKERHUB_TOKEN"

      - name: Log in to Docker Hub for image publishing
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: macbook201808/supernova:api-${{ steps.lock-sha.outputs.sha }}
          cache-from: type=gha,scope=supernova-api
          cache-to: type=gha,mode=max,scope=supernova-api

      - name: Build and push Console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/console/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.STAGING_API_BASE_URL }}
          tags: macbook201808/supernova:console-${{ steps.lock-sha.outputs.sha }}
          cache-from: type=gha,scope=supernova-console
          cache-to: type=gha,mode=max,scope=supernova-console

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$STAGING_SSH_PORT" -H "$STAGING_HOST" >> ~/.ssh/known_hosts

      - name: Upload Staging deployment and recovery files
        run: |
          ssh -p "$STAGING_SSH_PORT" "$STAGING_USER@$STAGING_HOST" "mkdir -p '$STAGING_DEPLOY_PATH'"
          scp -P "$STAGING_SSH_PORT" deploy/docker/compose.staging.yaml deploy/scripts/bootstrap-staging.sh deploy/scripts/deploy-staging.sh deploy/scripts/rollback-staging.sh deploy/scripts/acknowledge-staging-health.sh "$STAGING_USER@$STAGING_HOST:$STAGING_DEPLOY_PATH/"
          ssh -p "$STAGING_SSH_PORT" "$STAGING_USER@$STAGING_HOST" "chmod 700 '$STAGING_DEPLOY_PATH/'*.sh"

      - name: Check server bootstrap state
        id: bootstrap
        run: |
          if ssh -p "$STAGING_SSH_PORT" "$STAGING_USER@$STAGING_HOST" "test -s '$STAGING_DEPLOY_PATH/.env'"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy immutable image tag
        id: deploy
        if: steps.bootstrap.outputs.ready == 'true'
        run: |
          ssh -p "$STAGING_SSH_PORT" "$STAGING_USER@$STAGING_HOST" "set -eu; cd '$STAGING_DEPLOY_PATH'; ./deploy-staging.sh '${{ steps.lock-sha.outputs.sha }}' '${{ github.run_id }}' '${{ github.run_attempt }}'"

      - name: Verify deployed SHA and public Staging health
        id: post-deploy-verify
        if: steps.bootstrap.outputs.ready == 'true'
        env:
          DEPLOY_SHA: ${{ steps.lock-sha.outputs.sha }}
        run: |
          ssh -p "$STAGING_SSH_PORT" "$STAGING_USER@$STAGING_HOST" "set -eu; test \"\$(cat '$STAGING_DEPLOY_PATH/.last_successful_tag')\" = '$DEPLOY_SHA'; python3 -c 'import json,sys; record=json.load(open(sys.argv[1])); assert record.get(\"commit_sha\") == sys.argv[2]; assert record.get(\"status\") == \"healthy\"' '$STAGING_DEPLOY_PATH/.last_successful_deployment.json' '$DEPLOY_SHA'"

          api_base="${STAGING_API_BASE_URL%/}"
          console_base="${STAGING_CONSOLE_BASE_URL%/}"
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 5 --max-time 15 -fsS "$api_base/health/ready" >/dev/null && curl --connect-timeout 5 --max-time 15 -fsS "$console_base/" | grep -q "SuperNova"; then
              healthy=true
              break
            fi
            sleep 5
          done
          test "$healthy" = true
          {
            echo "## Staging deployment verified"
            echo "- Commit SHA: \`$DEPLOY_SHA\`"
            echo "- API: \`$api_base/health/ready\`"
            echo "- Console: \`$console_base/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Block deployment queue after failed deployment or health check
        if: always() && steps.bootstrap.outputs.ready == 'true' && (steps.deploy.outcome == 'failure' || steps.post-deploy-verify.outcome == 'failure')
        run: |
          ssh -p "$STAGING_SSH_PORT" "$STAGING_USER@$STAGING_HOST" "touch '$STAGING_DEPLOY_PATH/.staging-deployment-blocked'"

      - name: Report first-time server bootstrap
        if: steps.bootstrap.outputs.ready != 'true'
        run: |
          echo "Deployment files were uploaded, but the server .env is not initialized yet."
          echo "Initialize the server-only .env and MinIO bucket credentials before requesting another deployment."
          exit 1

  staging-acceptance:
    name: Staging acceptance
    needs: [deploy]
    runs-on: ubuntu-latest
    environment:
      name: staging-acceptance
      url: ${{ vars.STAGING_CONSOLE_BASE_URL || 'https://bot.wet001.com' }}
    steps:
      - name: Record accepted deployment SHA
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
        run: |
          {
            echo "## Staging acceptance approved"
            echo "- Commit SHA: \`$DEPLOY_SHA\`"
            echo "- Acceptance time (UTC): \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`"
          } >> "$GITHUB_STEP_SUMMARY"
